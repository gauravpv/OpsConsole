<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(pageTitle, searchPlaceholder)"
        class="opsconsole-header h-16 fixed top-0 right-0 left-[240px] bg-surface border-b border-outline-variant flex items-center justify-between px-unit-xl w-full z-40">
    <div class="flex items-center gap-unit-lg flex-1 min-w-0">
        <h2 class="oc-page-title font-headline-sm text-headline-sm font-bold text-primary shrink-0" th:text="${pageTitle}">Page</h2>
        <div class="relative w-full max-w-md ml-unit-xl" th:if="${searchPlaceholder != null}">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
            <input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-2 pl-10 pr-4 text-body-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-secondary/20 focus:border-secondary transition-all"
                   th:placeholder="${searchPlaceholder}" type="search"/>
        </div>
        <th:block th:replace="${extraHeader}" th:if="${extraHeader != null}"/>
    </div>
    <div class="flex items-center gap-unit-md shrink-0">
        <th:block th:replace="~{fragments/stitch-theme :: theme-toggle}"/>
        <div class="h-8 w-px bg-outline-variant mx-unit-xs"></div>
        <button type="button" class="p-2 hover:bg-surface-container-low rounded-full transition-all text-on-surface-variant" aria-label="Notifications">
            <span class="material-symbols-outlined">notifications</span>
        </button>
        <button type="button" class="p-2 hover:bg-surface-container-low rounded-full transition-all text-on-surface-variant" aria-label="Settings">
            <span class="material-symbols-outlined">settings</span>
        </button>
    </div>
</header>
</body>
</html>
